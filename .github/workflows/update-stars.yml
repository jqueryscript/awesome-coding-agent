name: Update Stars

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh star counts and ranking
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update-stars.py --refresh

      - name: Run validation
        run: |
          python -m unittest discover -s tests -v
          python scripts/update-stars.py --check

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md data/agents.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/agents.json
          git commit -m "chore: refresh GitHub star counts"
          git push
